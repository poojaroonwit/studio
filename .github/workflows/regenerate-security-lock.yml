name: Regenerate security lock

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global npm@11.6.2
      - name: Regenerate lock from package manifest
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic install
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Report remaining production advisories
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate dependency lock" || exit 0
          git push origin HEAD:fix/full-stabilization
