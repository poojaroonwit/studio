name: Sync Outborn launcher lock

on:
  push:
    branches: [dev]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact launcher SDK release
        run: |
          url="https://app-shell-sdk-release-production.up.railway.app/outborn-app-shell-0.1.7.tgz"
          archive="${RUNNER_TEMP}/outborn-app-shell-0.1.7.tgz"
          manifest="${RUNNER_TEMP}/outborn-app-shell-package.json"
          for attempt in $(seq 1 60); do
            rm -f "$archive" "$manifest"
            if curl --fail --silent --show-error --location "$url" --output "$archive" \
              && tar -xOzf "$archive" package/package.json > "$manifest" 2>/dev/null \
              && [ "$(node -p "require('$manifest').version")" = "0.1.7" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Exact Outborn app-shell 0.1.7 archive was not available" >&2
          exit 1
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync Outborn launcher dependency lock"
          git push origin HEAD:dev
