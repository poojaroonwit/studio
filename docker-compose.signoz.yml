version: '3.8'

# Environment variables can be set in:
# 1. .env.signoz file (recommended) - copy env.signoz.template to .env.signoz
# 2. Environment variables exported in shell
# 3. Passed directly to docker-compose

services:
  # ClickHouse - Time-series database for SigNoz
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: signoz-clickhouse
    env_file:
      - .env.signoz
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "10050:8123"  # HTTP interface
      - "10051:9000"  # Native interface
    environment:
      CLICKHOUSE_DB: signoz
      CLICKHOUSE_USER: signoz
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-signoz}
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: signoz-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "10052:2181"
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Kafka - Message queue for data ingestion
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: signoz-kafka
    depends_on:
      - zookeeper
    ports:
      - "10053:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:10053,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SigNoz Query Service - Backend API
  # To build the images, run: ./setup-signoz.sh
  # Or manually: git clone https://github.com/SigNoz/signoz.git && cd signoz/deploy/docker/clickhouse-setup && docker-compose build
  query-service:
    image: signoz/query-service:latest
    container_name: signoz-query-service
    env_file:
      - .env.signoz
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "10054:8080"
    environment:
      - ALERTMANAGER_API_PREFIX=http://localhost:9093/api/v1
      - ALERTMANAGER_ENABLED=false
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_ALT_ADDR=clickhouse:9000
      - CLICKHOUSE_AUTH_MECHANISM=password
      - CLICKHOUSE_DATABASE=signoz
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-signoz}
      - CLICKHOUSE_USERNAME=signoz
      - DASHBOARDS_PATH=/var/lib/signoz/dashboards
      - DEPLOYMENT_TYPE=docker
      - OTEL_COLLECTOR_GRPC_ENDPOINT=otel-collector:4317
      - OTEL_COLLECTOR_HTTP_ENDPOINT=otel-collector:4318
      - PROMETHEUS_QUERY_ENDPOINT=${PROMETHEUS_QUERY_ENDPOINT}
      - QUERY_SERVICE_PORT=8080
      - RELATIONAL_DATASOURCE_PATH=/var/lib/signoz/signoz.db
      - TELEMETRY_ENABLED=false
      - TRACE_OTLP_ENDPOINT=otel-collector:4318
    volumes:
      - signoz-data:/var/lib/signoz
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SigNoz Frontend - Web UI
  frontend:
    image: signoz/frontend:latest
    container_name: signoz-frontend
    depends_on:
      query-service:
        condition: service_healthy
    ports:
      - "10055:3301"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:10054
      - REACT_APP_BASE_URL=http://localhost:10055
      - REACT_APP_ENV=production
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:3301"]
      interval: 30s
      timeout: 5s
      retries: 3

  # OpenTelemetry Collector - Receives and processes telemetry data
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: signoz-otel-collector
    depends_on:
      - clickhouse
      - kafka
    ports:
      - "10056:4317"  # OTLP gRPC receiver
      - "10057:4318"  # OTLP HTTP receiver
      - "10058:8888"  # Prometheus metrics
      - "10059:8889"  # Prometheus exporter metrics
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - signoz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8888/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clickhouse-data:
    driver: local
  signoz-data:
    driver: local

networks:
  signoz-network:
    driver: bridge

