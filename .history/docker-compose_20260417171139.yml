  app:
    container_name: fitscan_app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "/app/entrypoint-local.sh"]
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    #   minio:
    #     condition: service_healthy
    ports:
      - "${APP_PORT:-8021}:8021"
    environment:
      PRODUCTION_HOST: ${PRODUCTION_HOST:-localhost}
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_PORT:-8021}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-fitscan-local-nextauth-secret-change-me-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-fitscan}:${POSTGRES_PASSWORD:-fitscan_local_password}@postgres:5432/${POSTGRES_DB:-fitscan}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-fitscan-user}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-fitscan-secret}}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fitscan}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:${MINIO_CONSOLE_PORT:-9001}}
      NEXT_PUBLIC_MINIO_BUCKET: ${NEXT_PUBLIC_MINIO_BUCKET:-fitscan}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL:-http://localhost:${MINIO_CONSOLE_PORT:-9001}}
      ALLOW_PUBLIC_FILES: ${ALLOW_PUBLIC_FILES:-false}
      USE_SIGNED_URLS_IN_WEBHOOKS: ${USE_SIGNED_URLS_IN_WEBHOOKS:-true}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      SKIP_SEED: ${SKIP_SEED:-false}

