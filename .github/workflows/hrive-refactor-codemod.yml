name: Hrive refactor codemod

on:
  push:
    branches:
      - refactor/hrive-large-modules

permissions:
  contents: write

jobs:
  learning-record-utils:
    if: ${{ !contains(github.event.head_commit.message, '[hrive-refactor-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/hrive-large-modules
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: node scripts/codemods/refactor-learning-record-utils.mjs
      - run: npx vitest run src/lib/learning/record-utils.test.ts
      - run: npm run type-check
      - run: npm run check:architecture
      - name: Commit deterministic refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/learning/LearningPageClient.tsx
          if git diff --cached --quiet; then
            echo "No codemod changes to commit."
          else
            git commit -m "refactor: wire learning record helpers [hrive-refactor-bot]"
            git push origin HEAD:refactor/hrive-large-modules
          fi
