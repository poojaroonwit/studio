# GitLab CI/CD Pipeline for HRI Kubernetes Deployment
# This pipeline handles building, testing, and deploying to Kubernetes

stages:
  - validate
  - test
  - build
  - security
  - deploy-staging
  - deploy-production
  - assurance

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1

  # Application variables
  APP_NAME: "hri"
  K8S_NAMESPACE: "hri"

  # Image registry (GitLab Container Registry)
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  # Kubernetes configuration
  KUBECTL_VERSION: "1.28.0"
  KUSTOMIZE_VERSION: "5.1.1"

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Services
services:
  - docker:dind

# Job templates
.job_template: &job_template
  image: node:18-alpine
  before_script:
    - apk add --no-cache git curl python3 py3-pip
    - npm ci

# Validation stage
validate:yaml:
  <<: *job_template
  stage: validate
  script:
    - echo "Validating YAML files..."
    - pip3 install yamllint
    - yamllint -d relaxed k8s/*.yaml || true
    - find k8s -name "*.yaml" -o -name "*.yml" | xargs -I {} sh -c 'python3 -c "import yaml; yaml.safe_load(open(\"{}\"))" && echo "✓ {}"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:k8s:
  image: bitnami/kubectl:latest
  stage: validate
  script:
    - echo "Validating Kubernetes manifests..."
    - kubectl apply --dry-run=client -k k8s/
    - echo "✓ All Kubernetes manifests are valid"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:docker:
  image: docker:latest
  stage: validate
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Validating Dockerfile..."
    - docker build --no-cache --target builder -t test-build -f Dockerfile . || true
    - echo "✓ Dockerfile is valid"
  after_script:
    - docker system prune -f
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test stage
test:lint:
  <<: *job_template
  stage: test
  script:
    - echo "Running ESLint..."
    - npm run lint
  artifacts:
    reports:
      junit: reports/eslint.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:typecheck:
  <<: *job_template
  stage: test
  script:
    - echo "Running TypeScript type checking..."
    - npm run type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  <<: *job_template
  stage: test
  script:
    - echo "Running unit and control-integrity tests..."
    - npm run test:run
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:audit-database:
  <<: *job_template
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: audit_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: audit_test_password
    DATABASE_URL: postgresql://postgres:audit_test_password@postgres:5432/audit_test
    AUDIT_TEST_ALLOW_RESET: "true"
  script:
    - npx prisma db execute --schema=prisma/schema.prisma --file=scripts/ensure-postgresql-extensions.sql
    - npx prisma migrate deploy --schema=prisma/schema.prisma
    - npm run audit:verify-database
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build stage - App Image
build:app:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building App Docker image..."
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        --build-arg VERSION=$CI_COMMIT_TAG \
        -t $IMAGE_NAME:$IMAGE_TAG \
        -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG \
        -f Dockerfile .
    - echo "Pushing App images to registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    # Push environment-specific tags based on branch
    - |
      if [ "$CI_COMMIT_BRANCH" == "dev" ]; then
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:dev
        docker push $IMAGE_NAME:dev
        echo "✓ Pushed dev tag"
      elif [ "$CI_COMMIT_BRANCH" == "uat" ]; then
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:uat
        docker push $IMAGE_NAME:uat
        echo "✓ Pushed uat tag"
      elif [ "$CI_COMMIT_BRANCH" == "master" ] || [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:prod
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:prod
        echo "✓ Pushed latest and prod tags"
      fi
    - echo "✓ App image built and pushed successfully"
    - echo "Image: $IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH
  tags:
    - docker

# Build stage - Processor Image
build:processor:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    PROCESSOR_IMAGE_NAME: $CI_REGISTRY_IMAGE-processor
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Processor Docker image..."
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        --build-arg VERSION=$CI_COMMIT_TAG \
        -t $PROCESSOR_IMAGE_NAME:$IMAGE_TAG \
        -t $PROCESSOR_IMAGE_NAME:$CI_COMMIT_REF_SLUG \
        -t $PROCESSOR_IMAGE_NAME:latest \
        -f Dockerfile .
    - echo "Pushing Processor images to registry..."
    - docker push $PROCESSOR_IMAGE_NAME:$IMAGE_TAG
    - docker push $PROCESSOR_IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker push $PROCESSOR_IMAGE_NAME:latest
      fi
    - echo "✓ Processor image built and pushed successfully"
    - echo "Image: $PROCESSOR_IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH
  tags:
    - docker

# Security stage
security:scan:
  image: aquasec/trivy:latest
  stage: security
  services:
    - docker:dind
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Running Trivy security scan..."
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --format template --template "@contrib/gitlab.tpl" -o gl-container-scanning-report.json $IMAGE_NAME:$IMAGE_TAG
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Deploy to Staging
deploy:staging:
  image: bitnami/kubectl:latest
  stage: deploy-staging
  before_script:
    - apk add --no-cache curl
    - |
      # Install kubectl if not available
      if ! command -v kubectl &> /dev/null; then
        curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      fi
    - |
      # Install kustomize
      curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash || {
        # Fallback: download pre-built binary
        curl -LO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        tar -xzf kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
        chmod +x kustomize
      }
      mv kustomize /usr/local/bin/ || true
    - |
      # Setup Kubernetes authentication
      if [ -n "$K8S_STAGING_CA_CERT" ]; then
        echo "$K8S_STAGING_CA_CERT" | base64 -d > /tmp/ca.crt
      fi
      if [ -n "$K8S_STAGING_TOKEN" ]; then
        echo "$K8S_STAGING_TOKEN" > /tmp/token
      fi
      mkdir -p ~/.kube
      |
      cat > ~/.kube/config <<EOF
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          certificate-authority-data: $(echo "$K8S_STAGING_CA_CERT" | base64 -w 0)
          server: $K8S_STAGING_SERVER
        name: staging-cluster
      contexts:
      - context:
          cluster: staging-cluster
          user: staging-user
          namespace: $K8S_NAMESPACE
        name: staging-context
      current-context: staging-context
      users:
      - name: staging-user
        user:
          token: $K8S_STAGING_TOKEN
      EOF
    - kubectl version --client
    - kubectl config get-contexts
  script:
    - echo "Deploying to staging Kubernetes cluster..."
    - |
      # Update kustomization with staging image
      cd k8s
      kustomize edit set image hri=$IMAGE_NAME:$IMAGE_TAG
      cat kustomization.yaml
    - |
      # Apply manifests
      kubectl apply -k . --dry-run=client
      kubectl apply -k .
    - |
      # Wait for deployments to be ready
      echo "Waiting for deployments to be ready..."
      kubectl wait --for=condition=available --timeout=300s deployment/hri-app -n $K8S_NAMESPACE || true
      kubectl wait --for=condition=available --timeout=300s deployment/hri-processor -n $K8S_NAMESPACE || true
    - |
      # Show deployment status
      echo "Deployment Status:"
      kubectl get all -n $K8S_NAMESPACE
      kubectl get pods -n $K8S_NAMESPACE
    - echo "✓ Staging deployment completed"
  environment:
    name: staging
    url: $STAGING_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "staging"
  when: manual
  tags:
    - kubernetes

# Deploy to Production
deploy:production:
  image: bitnami/kubectl:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache curl
    - |
      # Install kubectl if not available
      if ! command -v kubectl &> /dev/null; then
        curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      fi
    - |
      # Install kustomize
      curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash || {
        # Fallback: download pre-built binary
        curl -LO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        tar -xzf kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
        chmod +x kustomize
      }
      mv kustomize /usr/local/bin/ || true
    - |
      # Setup Kubernetes authentication
      mkdir -p ~/.kube
      |
      cat > ~/.kube/config <<EOF
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          certificate-authority-data: $(echo "$K8S_PRODUCTION_CA_CERT" | base64 -w 0)
          server: $K8S_PRODUCTION_SERVER
        name: production-cluster
      contexts:
      - context:
          cluster: production-cluster
          user: production-user
          namespace: $K8S_NAMESPACE
        name: production-context
      current-context: production-context
      users:
      - name: production-user
        user:
          token: $K8S_PRODUCTION_TOKEN
      EOF
    - kubectl version --client
    - kubectl config get-contexts
  script:
    - echo "Deploying to production Kubernetes cluster..."
    - |
      # Update kustomization with production image
      cd k8s
      kustomize edit set image hri=$IMAGE_NAME:$IMAGE_TAG
      cat kustomization.yaml
    - |
      # Apply manifests with production tag
      kubectl apply -k . --dry-run=client
      kubectl apply -k .
    - |
      # Wait for deployments to be ready
      echo "Waiting for deployments to be ready..."
      kubectl wait --for=condition=available --timeout=600s deployment/hri-app -n $K8S_NAMESPACE || true
      kubectl wait --for=condition=available --timeout=600s deployment/hri-processor -n $K8S_NAMESPACE || true
    - |
      # Show deployment status
      echo "Deployment Status:"
      kubectl get all -n $K8S_NAMESPACE
      kubectl get pods -n $K8S_NAMESPACE
      kubectl get hpa -n $K8S_NAMESPACE
    - |
      # Health check
      echo "Performing health check..."
      sleep 30
      kubectl get pods -n $K8S_NAMESPACE -l app=hri-app -o jsonpath='{.items[0].status.phase}' | grep -q Running && echo "✓ Application is running"
    - echo "✓ Production deployment completed"
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  tags:
    - kubernetes

# Rollback job
rollback:production:
  image: bitnami/kubectl:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache curl
    - |
      if ! command -v kubectl &> /dev/null; then
        curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      fi
    - |
      mkdir -p ~/.kube
      |
      cat > ~/.kube/config <<EOF
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          certificate-authority-data: $(echo "$K8S_PRODUCTION_CA_CERT" | base64 -w 0)
          server: $K8S_PRODUCTION_SERVER
        name: production-cluster
      contexts:
      - context:
          cluster: production-cluster
          user: production-user
          namespace: $K8S_NAMESPACE
        name: production-context
      current-context: production-context
      users:
      - name: production-user
        user:
          token: $K8S_PRODUCTION_TOKEN
      EOF
  script:
    - echo "Rolling back production deployment..."
    - kubectl rollout undo deployment/hri-app -n $K8S_NAMESPACE
    - kubectl rollout undo deployment/hri-processor -n $K8S_NAMESPACE
    - kubectl rollout status deployment/hri-app -n $K8S_NAMESPACE
    - kubectl rollout status deployment/hri-processor -n $K8S_NAMESPACE
    - echo "✓ Rollback completed"
  environment:
    name: production
    action: rollback
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  tags:
    - kubernetes

record:production-assurance:
  image: node:20-alpine
  stage: assurance
  needs:
    - job: deploy:production
  variables:
    AUDIT_ASSURANCE_KIND: "change_release"
    AUDIT_ASSURANCE_STATUS: "passed"
    AUDIT_ASSURANCE_REFERENCE: $CI_COMMIT_SHA
  script:
    - node scripts/submit-audit-assurance.mjs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUDIT_ASSURANCE_URL && $AUTOMATION_API_KEY
  tags:
    - kubernetes

# Cleanup stage
cleanup:
  image: docker:latest
  stage: .post
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Cleaning up old images..."
    - docker image prune -f
    - docker system prune -f
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: always
