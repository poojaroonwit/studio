name: Native Android cloud emulator

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Railway-hosted Hrive is reachable
        run: curl --fail --location --max-time 30 --silent --show-error https://people.outborn.co/employee-portal --output /dev/null

      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: mobile
        env:
          NATIVE_PLATFORM: android
        run: npm run native:prepare

      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Boot emulator, install and launch Hrive
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p co.outborn.people -c android.intent.category.LAUNCHER 1
            sleep 20
            PID=$(adb shell pidof co.outborn.people | tr -d '\r')
            test -n "$PID"
            echo "Hrive process is running with PID $PID"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > mobile/android-emulator.png
            adb logcat -d '*:E' > mobile/android-emulator-errors.log || true

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrive-android-emulator-evidence
          path: |
            mobile/android-emulator.png
            mobile/android-emulator-errors.log
          if-no-files-found: warn
          retention-days: 7
