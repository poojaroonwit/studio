name: Sync Outborn Account SDK lock

on:
  push:
    branches: [dev]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Account directory SDK release
        run: |
          url="https://account-directory-sdk-release-production.up.railway.app/outborn-account-directory-0.1.1.tgz"
          archive="${RUNNER_TEMP}/outborn-account-directory-0.1.1.tgz"
          manifest="${RUNNER_TEMP}/outborn-account-directory-package.json"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          tar -xOzf "$archive" package/package.json > "$manifest"
          test "$(node -p "require('$manifest').version")" = "0.1.1"
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync Outborn Account SDK dependency lock"
          git push origin HEAD:dev
