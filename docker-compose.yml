services:
  app:
    container_name: 8021_fitscan_app
    # image: studio-6-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    ports:
      - "${APP_PORT:-8021}:8021"
    # For production deployments, you typically want the application code to be self-contained
    # within the Docker image. The volume mount `.:/app` is primarily for local development to
    # reflect code changes without rebuilding the image. It's commented out for production-like behavior.
    # If this mount is active in a production-like environment (e.g., Portainer deploying from an image
    # or a CI/CD pipeline), and the host path "." does not contain your application code (including package.json),
    # it will overwrite the files copied into the image, leading to "package.json not found" errors.
    # volumes:
    #   - .:/app # Ensure this is commented out or removed for production deployments where the image is self-contained.
    #
    # The named volumes below are generally fine and can be useful for persisting
    # node_modules and the .next build cache across container restarts, potentially
    # speeding up subsequent starts if the underlying image hasn't changed significantly.
    # volumes:
      # - app_node_modules:/app/node_modules
      # - app_next:/app/.next
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      # Azure AD Configuration (Optional - set these only if you want to use Azure AD SSO)
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      # Public Azure AD variables for client-side detection (Optional)
      NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
      # RESUME_PROCESSING_WEBHOOK_URL is the generic fallback for resume processing webhook
      RESUME_PROCESSING_WEBHOOK_URL: ${RESUME_PROCESSING_WEBHOOK_URL}
      RESUME_PROCESSING_WEBHOOK_TOKEN: ${RESUME_PROCESSING_WEBHOOK_TOKEN}
      # GENERAL_PDF_WEBHOOK_URL is used for automated candidate creation from PDF resumes
      # GENERAL_PDF_WEBHOOK_URL: ${GENERAL_PDF_WEBHOOK_URL}
      # GENERAL_PDF_WEBHOOK_TOKEN: ${GENERAL_PDF_WEBHOOK_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    
      NODE_ENV: ${NODE_ENV}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY}
      PROCESSOR_URL: ${PROCESSOR_URL}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DATABASE_CONNECTION_TIMEOUT: ${DATABASE_CONNECTION_TIMEOUT:-1800000}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-1000}
      DATABASE_IDLE_TIMEOUT: ${DATABASE_IDLE_TIMEOUT:-30000}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      # REMOVE_MIGRATION_FILES: ${REMOVE_MIGRATION_FILES:-false}
      SKIP_SEED: ${SKIP_SEED:-false}
      # N8N Database variables (for database creation)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCTION_HOST: ${PRODUCTION_HOST}
      PROCESSOR_PORT: ${PROCESSOR_PORT}
      DB_POSTGRESDB_CONNECTION_TIMEOUT: ${DB_POSTGRESDB_CONNECTION_TIMEOUT:-60000}
   
      # N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    depends_on:
      - postgres
      - minio
    mem_limit: 8g
    cpus: 2
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8g
    #       cpus: '2'
    #     reservations:
    #       memory: 4g
    #       cpus: '2'
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     max_attempts: 5
    #     window: 120s
    restart: unless-stopped
    # The command to run the application is defined in the Dockerfile's CMD instruction
    # which uses wait-for-db.sh for optimized startup
    networks:
      - docker_internal
      - default

  postgres:
    container_name: 8021_fitscan_postgres
    image: postgres:14-alpine
    ports:
      - "${POSTGRES_PORT:-8521}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/dockers/8021/postgres:/var/lib/postgresql/data
    # Resource limits
    mem_limit: 8g
    cpus: 2
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - docker_internal

  minio:
    container_name: 8021_fitscan_minio
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9847}:9000" # MinIO API port
      - "${MINIO_CONSOLE_PORT:-9848}:9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MINIO_SERVER_URL: http://localhost:9000
      # MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_PUBLIC_BASE_URL}

      # #–– public URL so presigned links stay HTTPS ––
      MINIO_SERVER_URL: ${MINIO_PUBLIC_BASE_URL}
      
      #–– CORS done 100 % here –– (⇠ NO spaces!)
      MINIO_API_CORS_ALLOW_ORIGIN:  ${PRODUCTION_HOST}
      MINIO_API_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE
      MINIO_API_CORS_ALLOW_HEADERS: Authorization,Content-Type,X-Amz-Date,X-Amz-Content-Sha256,X-Amz-Security-Token,X-Requested-With

    command: server /data --console-address ":9001" --address ":9000"
    volumes:
      - /var/dockers/8021/minio:/data
    # Resource limits
    mem_limit: 8g
    cpus: 2
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - docker_internal

  # Upload Queue Processor Service
  upload-queue-processor:
    container_name: 8021_fitscan_process_queue
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "/app/entrypoint-processor.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY:-dev-key}
      PROCESSOR_URL: ${PROCESSOR_URL:-http://8021_fitscan_app:8021}
      UPLOAD_QUEUE_PROCESS_URL: ${UPLOAD_QUEUE_PROCESS_URL:-http://8021_fitscan_app:8021/api/upload-queue/process}
      PROCESSOR_INTERVAL_MS: ${PROCESSOR_INTERVAL_MS:-5000}
      LOG_INTERVAL_MS: ${LOG_INTERVAL_MS:-30000}
      PROCESSOR_QUIET_MODE: ${PROCESSOR_QUIET_MODE:-true}
      PROCESSOR_CONNECTION_TIMEOUT_MS: ${PROCESSOR_CONNECTION_TIMEOUT_MS:-30000}
      PROCESSOR_REQUEST_TIMEOUT_MS: ${PROCESSOR_REQUEST_TIMEOUT_MS:-120000}
      NODE_ENV: ${NODE_ENV}
      DOCKER_ENV: true
    depends_on:
      - postgres
      - app
    mem_limit: 8g
    cpus: 2
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - docker_internal

