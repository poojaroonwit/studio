name: Hrive commercial metadata cleanup v2

on:
  push:
    branches: ['feat/hrive-outborn-core-integration']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/hrive-outborn-core-integration
      - name: Update commercial navigation and deployment docs
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/app/settings/settings-page-model.ts')
          text = model.read_text()
          href_old = "href: '/settings/policy-configuration?area=billing'"
          href_new = "href: '/settings/billing'"
          if href_old not in text:
              raise SystemExit('Legacy billing settings href was not found')
          text = text.replace(href_old, href_new, 1)
          start = text.index(href_new)
          end = text.find('\n  },', start)
          if end < 0:
              raise SystemExit('Could not isolate Billing settings item')
          block = text[start:end]
          for old, new in [
              ("label: 'Billing Preferences'", "label: 'Billing & Plan'"),
              ("description: 'Manage billing contacts, invoice preferences, purchase-order requirements, and renewal alerts.'", "description: 'Manage the shared Outborn subscription, invoices, usage, entitlements, and billing details.'"),
              ("value: 'Configure'", "value: 'Manage'"),
          ]:
              if old not in block:
                  raise SystemExit(f'Missing Billing settings field: {old}')
              block = block.replace(old, new, 1)
          model.write_text(text[:start] + block + text[end:])

          readme = Path('README.md')
          text = readme.read_text()
          core_url = 'OUTBORN_CORE_URL=https://core.example.com'
          timeout_line = 'OUTBORN_SERVICE_REQUEST_TIMEOUT_MS=7000'
          if timeout_line not in text:
              if core_url not in text:
                  raise SystemExit('Core URL environment example was not found')
              text = text.replace(core_url, core_url + '\n' + timeout_line, 1)

          auth_old = "Hrive keeps the Account OAuth access token only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes; it never receives the Account bearer token or Stripe secrets."
          if auth_old in text:
              auth_new = """Before first production sign-in, register Hrive as an Outborn Account public PKCE client. From `outborn-core/apps/account-web`, run:

```bash
OUTBORN_OAUTH_CLIENT_ID=outborn-hrive-web \\
OUTBORN_OAUTH_CLIENT_NAME=Hrive \\
OUTBORN_OAUTH_REDIRECT_URIS=https://your-app.example.com/api/auth/callback/outborn-account \\
OUTBORN_OAUTH_CLIENT_REGISTER_APPLY=true \\
npm run auth:register-product-client
```

The Account registrar enables authorization-code + refresh-token grants, PKCE, `offline_access`, and organization scopes for this public client. Hrive keeps the Account OAuth access and refresh tokens only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes; it never receives Account bearer credentials or Stripe secrets."""
              text = text.replace(auth_old, auth_new, 1)
          elif 'npm run auth:register-product-client' not in text:
              raise SystemExit('Account OAuth deployment paragraph was not found')
          readme.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/app/settings/settings-page-model.ts
          git commit -m "refactor: remove legacy billing navigation metadata"
          git push origin HEAD:feat/hrive-outborn-core-integration
