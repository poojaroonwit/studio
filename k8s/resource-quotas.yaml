apiVersion: v1
kind: ResourceQuota
metadata:
  name: fitscan-resource-quota
  namespace: fitscan
  labels:
    app.kubernetes.io/name: fitscan
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    persistentvolumeclaims: "4"
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: fitscan-limit-range
  namespace: fitscan
  labels:
    app.kubernetes.io/name: fitscan
spec:
  limits:
  - default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: "100m"
      memory: 256Mi
    type: Container
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: "50m"
      memory: 64Mi
    type: Container

