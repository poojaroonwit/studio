apiVersion: v1
kind: Secret
metadata:
  name: hri-secrets
  namespace: ba-hri
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:PORT/DATABASE"
  NEXTAUTH_SECRET: "CHANGE_THIS_GENERATE_SECURE_SECRET"
  NEXTAUTH_URL: "https://your-app.example.com"
  STORAGE_ENDPOINT: "https://your-storage-endpoint"
  STORAGE_ACCESS_KEY_ID: "your-storage-access-key"
  STORAGE_SECRET_ACCESS_KEY: "your-storage-secret-key"
  STORAGE_PUBLIC_BASE_URL: "https://your-storage-public-base-url"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_THIS_SECURE_ADMIN_PASSWORD"

  # Optional integrations
  GOOGLE_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  RESUME_PROCESSING_WEBHOOK_URL: ""
  RESUME_PROCESSING_WEBHOOK_TOKEN: ""
  GENERAL_PDF_WEBHOOK_URL: ""
  GENERAL_PDF_WEBHOOK_TOKEN: ""
  AZURE_AD_CLIENT_ID: ""
  AZURE_AD_CLIENT_SECRET: ""
  AZURE_AD_TENANT_ID: ""
