services:
  app:
    container_name: 8021_fitscan_app
    image: nccgit.qsncc.com:5555/ba/fitscan:1.2.4-beta.2
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-8021}:8021"

    environment:
      # Application Configuration
      PRODUCTION_HOST: ${PRODUCTION_HOST}
      NODE_ENV: ${NODE_ENV:-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Database Configuration
      DATABASE_URL: ${DATABASE_URL}

      # MinIO / Object Storage Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fitscan}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MINIO_BUCKET: ${NEXT_PUBLIC_MINIO_BUCKET:-fitscan}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL}

      # Security Features
      ALLOW_PUBLIC_FILES: ${ALLOW_PUBLIC_FILES:-false}
      USE_SIGNED_URLS_IN_WEBHOOKS: ${USE_SIGNED_URLS_IN_WEBHOOKS:-true}

    restart: unless-stopped
    # volumes:
    #   - ./entrypoint.sh:/app/entrypoint.sh

    # The command to run the application is defined in the Dockerfile's CMD instruction
    # which uses wait-for-db.sh for optimized startup
    networks:
      - docker_internal
      - default

networks:
  default:
    driver: bridge
  docker_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.30.0/24
          gateway: 172.25.30.1
