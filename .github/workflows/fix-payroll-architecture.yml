name: Fix payroll architecture ratchet

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-payroll-architecture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Remove nonfunctional line growth
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/lib/payroll/service.ts')
          text = path.read_text(encoding='utf-8')
          old = 'import type { Prisma } from "@prisma/client";\n\nimport prisma from "@/lib/prisma";'
          new = 'import type { Prisma } from "@prisma/client";\nimport prisma from "@/lib/prisma";'
          if text.count(old) != 1:
              raise SystemExit('Expected payroll import separator not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-payroll-architecture.yml').unlink()
          PY

      - name: Commit ratchet-preserving cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/payroll/service.ts .github/workflows/fix-payroll-architecture.yml
          git commit -m "Preserve payroll architecture budget"
          git push origin HEAD:dev
