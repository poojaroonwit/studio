  app:
    container_name: fitscan_app
    image: nccgit.qsncc.com:5555/ba/fitscan:1.2.6
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # command: ["/bin/sh", "/app/entrypoint-local.sh"]
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    ports:
      - "${APP_PORT:-8021}:8021"
    environment:
      PRODUCTION_HOST: ${PRODUCTION_HOST:-localhost}
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_PORT:-8021}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-fitscan-local-nextauth-secret-change-me-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3-compatible}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-fitscan}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?STORAGE_PUBLIC_BASE_URL is required}
      ALLOW_PUBLIC_FILES: ${ALLOW_PUBLIC_FILES:-false}
      USE_SIGNED_URLS_IN_WEBHOOKS: ${USE_SIGNED_URLS_IN_WEBHOOKS:-true}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      SKIP_SEED: ${SKIP_SEED:-false}

