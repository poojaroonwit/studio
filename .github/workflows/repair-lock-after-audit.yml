name: Repair lock after audit

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - name: Reconcile package manifest and lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify clean install contract
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Commit repaired lock and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-lock-after-audit.yml
          git add package-lock.json
          git commit -m "fix: restore deterministic npm lockfile"
          git push origin HEAD:fix/full-stabilization
