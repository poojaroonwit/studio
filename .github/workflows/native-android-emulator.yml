name: Native Android cloud emulator

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Railway-hosted Hrive is reachable
        run: curl --fail --location --max-time 30 --silent --show-error https://people.outborn.co/employee-portal --output /dev/null

      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: mobile
        env:
          NATIVE_PLATFORM: android
        run: npm run native:prepare

      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Boot emulator, install and launch Hrive
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -netdelay none -netspeed full
          script: |
            adb shell cmd connectivity airplane-mode disable || true
            adb shell svc wifi enable || true
            adb shell svc data enable || true
            NETWORK_READY=0
            for i in $(seq 1 60); do
              if adb shell dumpsys connectivity | grep -q 'VALIDATED'; then
                NETWORK_READY=1
                break
              fi
              sleep 2
            done
            adb shell dumpsys connectivity > mobile/android-emulator-connectivity.txt || true
            if [ "$NETWORK_READY" -ne 1 ]; then
              echo 'Android emulator network never reached VALIDATED state.'
              exit 1
            fi
            adb logcat -c
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop co.outborn.people
            adb shell am start -W -n co.outborn.people/.MainActivity > mobile/android-emulator-start.txt 2>&1
            sleep 25
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > mobile/android-emulator-focus.txt || true
            adb shell dumpsys activity activities | grep -A 12 -B 4 'co.outborn.people' > mobile/android-emulator-activity.txt || true
            adb exec-out screencap -p > mobile/android-emulator.png || true
            adb logcat -d > mobile/android-emulator-logcat.txt || true
            adb shell pidof co.outborn.people | tr -d '\r' | tee mobile/android-emulator-pid.txt | grep -Eq '[0-9]+'
            grep -q 'co.outborn.people/.MainActivity' mobile/android-emulator-focus.txt
            ! grep -q 'FATAL EXCEPTION.*co.outborn.people' mobile/android-emulator-logcat.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrive-android-emulator-evidence
          path: |
            mobile/android-emulator.png
            mobile/android-emulator-start.txt
            mobile/android-emulator-focus.txt
            mobile/android-emulator-activity.txt
            mobile/android-emulator-connectivity.txt
            mobile/android-emulator-logcat.txt
            mobile/android-emulator-pid.txt
          if-no-files-found: warn
          retention-days: 7
