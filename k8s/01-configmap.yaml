apiVersion: v1
kind: ConfigMap
metadata:
  name: fitscan-config
  namespace: ba-fitscan
data:
  # Application Configuration
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  APP_TIMEZONE: "Asia/Bangkok"

  # Database Configuration (External)
  POSTGRES_DB: "fitscan"
  POSTGRES_HOST: "ncc-pgsql-data-product.qsncc.com"
  POSTGRES_PORT: "5432"

  # Database Connection Pool Configuration
  DATABASE_SSL: "true" # Usually true for external databases
  DATABASE_SSL_REJECT_UNAUTHORIZED: "false" # Allow self-signed certificates
  DATABASE_MAX_CONNECTIONS: "20"
  DATABASE_IDLE_TIMEOUT: "5000"
  DATABASE_CONNECTION_TIMEOUT: "30000"
  DATABASE_STATEMENT_TIMEOUT: "30000"

  # MinIO Configuration (External)
  MINIO_ENDPOINT: "ncc-prod-api-storage-data-product.qsncc.com"
  MINIO_PORT: "9000"
  MINIO_BUCKET_NAME: "fitscan"
  MINIO_USE_SSL: "true"

  # Migration Configuration
  MIGRATION_FAILURE_ACTION: "continue"
  SKIP_FAILED_MIGRATIONS: "true"
  DB_PUSH_FALLBACK: "true"
  SKIP_SEED: "false"

  # Processor Configuration
  PROCESSOR_INTERVAL_MS: "5000"
  MAX_CONCURRENT_PROCESSORS: "1"
  LOG_INTERVAL_MS: "5000"
  PROCESSOR_CONNECTION_TIMEOUT_MS: "5000"
  PROCESSOR_REQUEST_TIMEOUT_MS: "120000"
  PROCESSOR_QUIET_MODE: "true"

  # SigNoz Configuration
  SIGNOZ_ENABLED: "true"
  OTEL_SERVICE_NAME: "fitscan"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4318"
