apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fitscan
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BROWSER_REDIRECT_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: MINIO_PUBLIC_BASE_URL
        - name: MINIO_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: MINIO_PUBLIC_BASE_URL
        - name: MINIO_API_CORS_ALLOW_ORIGIN
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: PRODUCTION_HOST
        - name: MINIO_API_CORS_ALLOW_METHODS
          value: "GET,PUT,POST,DELETE"
        - name: MINIO_API_CORS_ALLOW_HEADERS
          value: "Authorization,Content-Type,X-Amz-Date,X-Amz-Content-Sha256,X-Amz-Security-Token,X-Requested-With"
        command:
        - /bin/sh
        - -c
        - minio server /data --console-address ":9001" --address ":9000"
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: fitscan
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: console
    port: 9001
    targetPort: 9001
    protocol: TCP
  type: ClusterIP
