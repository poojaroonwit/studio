# GitLab CI/CD Pipeline for Studio-5 HR AI Screening Application
# This pipeline handles building, testing, and deploying the application

stages:
  - validate
  - test
  - build
  - security
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$CI_PROJECT_DIR/.certs"
  
  # Application variables
  APP_NAME: "studio-5"
  APP_VERSION: "1.0.0"
  
  # Docker registry variables (configure these in GitLab CI/CD variables)
  # DOCKER_REGISTRY: "your-registry.com"
  # DOCKER_USERNAME: $CI_REGISTRY_USER
  # DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Services
services:
  - docker:dind

# Job templates
.job_template: &job_template
  image: node:18-alpine
  before_script:
    - apk add --no-cache git curl
    - npm ci

# Validation stage
validate:yaml:
  <<: *job_template
  stage: validate
  script:
    - echo "Validating YAML files..."
    - find . -name "*.yml" -o -name "*.yaml" | xargs -I {} sh -c 'echo "Validating {}"; python3 -c "import yaml; yaml.safe_load(open(\"{}\"))"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:docker:
  image: docker:latest
  stage: validate
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Validating Dockerfiles..."
    - docker build --no-cache -t test-app -f Dockerfile .
    - docker build --no-cache -t test-processor -f Dockerfile.processor .
    - docker build --no-cache -t test-app-8021 -f Dockerfile.8021 .
    - docker build --no-cache -t test-processor-8021 -f Dockerfile.processor.8021 .
    - echo "Docker builds successful"
  after_script:
    - docker system prune -f
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test stage
test:lint:
  <<: *job_template
  stage: test
  script:
    - echo "Running ESLint..."
    - npm run lint
  artifacts:
    reports:
      junit: reports/eslint.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  <<: *job_template
  stage: test
  script:
    - echo "Running unit tests..."
    - npm run test:unit
  artifacts:
    reports:
      junit: reports/junit.xml
    coverage_report:
      coverage_format: cobertura
      path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:integration:
  <<: *job_template
  stage: test
  services:
    - postgres:14-alpine
    - redis:alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
    REDIS_URL: redis://redis:6379
  script:
    - echo "Running integration tests..."
    - npm run test:integration
  artifacts:
    reports:
      junit: reports/integration.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build stage
build:app:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building main application image..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -f Dockerfile .
    - docker build -t $CI_REGISTRY_IMAGE:latest -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:processor:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building processor image..."
    - docker build -t $CI_REGISTRY_IMAGE/processor:$CI_COMMIT_SHA -f Dockerfile.processor .
    - docker build -t $CI_REGISTRY_IMAGE/processor:latest -f Dockerfile.processor .
    - docker push $CI_REGISTRY_IMAGE/processor:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/processor:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:app-8021:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building 8021 application image..."
    - docker build -t $CI_REGISTRY_IMAGE/8021:$CI_COMMIT_SHA -f Dockerfile.8021 .
    - docker build -t $CI_REGISTRY_IMAGE/8021:latest -f Dockerfile.8021 .
    - docker push $CI_REGISTRY_IMAGE/8021:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/8021:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:processor-8021:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building 8021 processor image..."
    - docker build -t $CI_REGISTRY_IMAGE/processor-8021:$CI_COMMIT_SHA -f Dockerfile.processor.8021 .
    - docker build -t $CI_REGISTRY_IMAGE/processor-8021:latest -f Dockerfile.processor.8021 .
    - docker push $CI_REGISTRY_IMAGE/processor-8021:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/processor-8021:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Security stage
security:scan:
  image: docker:latest
  stage: security
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl
    - curl -sSL https://get.docker.com/ | sh
  script:
    - echo "Running security scan..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  artifacts:
    reports:
      security: gl-security-scanning-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy staging stage
deploy:staging:
  image: alpine:latest
  stage: deploy-staging
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging environment..."
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && git pull origin $CI_COMMIT_BRANCH"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose pull"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose up -d"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose ps"
  environment:
    name: staging
    url: https://staging.studio-5.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

# Deploy production stage
deploy:production:
  image: alpine:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production environment..."
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && git pull origin $CI_COMMIT_BRANCH"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose pull"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose up -d"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose ps"
  environment:
    name: production
    url: https://studio-5.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

# Deploy 8021 staging
deploy:staging-8021:
  image: alpine:latest
  stage: deploy-staging
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying 8021 to staging environment..."
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && git pull origin $CI_COMMIT_BRANCH"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose -f docker-compose.8021.yml pull"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose -f docker-compose.8021.yml up -d"
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose -f docker-compose.8021.yml ps"
  environment:
    name: staging-8021
    url: https://staging-8021.studio-5.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

# Deploy 8021 production
deploy:production-8021:
  image: alpine:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying 8021 to production environment..."
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && git pull origin $CI_COMMIT_BRANCH"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose -f docker-compose.8021.yml pull"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose -f docker-compose.8021.yml up -d"
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose -f docker-compose.8021.yml ps"
  environment:
    name: production-8021
    url: https://8021.studio-5.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

# Cleanup stage
cleanup:
  image: docker:latest
  stage: .post
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Cleaning up old images..."
    - docker image prune -f
    - docker system prune -f
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: always 