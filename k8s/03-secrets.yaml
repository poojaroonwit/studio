  NEXTAUTH_URL: "https://your-domain.com"
  PRODUCTION_HOST: "https://your-domain.com"
  # MinIO Public URLs (External)
  MINIO_PUBLIC_BASE_URL: "https://ncc-dev-api-storage-data-product.qsncc.com"
  NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: "https://ncc-dev-api-storage-data-product.qsncc.com"
  NEXT_PUBLIC_MINIO_BUCKET: "fitscan"
  PROCESSOR_URL: "https://your-domain.com/api/upload-queue/process"
  UPLOAD_QUEUE_PROCESS_URL: "https://your-domain.com/api/upload-queue/process"
  RESUME_PROCESSING_WEBHOOK_URL: "https://ncc-dify.qsncc.com/v1/workflows/run"
  GENERAL_PDF_WEBHOOK_URL: "https://ncc-dify.qsncc.com/v1/workflows/run"
