apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitscan-app
  namespace: ba-fitscan
  labels:
    app: fitscan-app
    app.kubernetes.io/name: fitscan
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fitscan-app
  template:
    metadata:
      labels:
        app: fitscan-app
        app.kubernetes.io/name: fitscan
        app.kubernetes.io/component: app
        app.kubernetes.io/version: "0.2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/health"
    spec:
      serviceAccountName: fitscan-app
      imagePullSecrets:
      - name: gitlab-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fitscan-app
          image: nccgit.qsncc.com:5555/ba/fitscan:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            # Database Configuration (External)
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: POSTGRES_PORT

            # MinIO Configuration (External)
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: MINIO_PORT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: MINIO_BUCKET_NAME
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: MINIO_USE_SSL
            - name: MINIO_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: MINIO_PUBLIC_BASE_URL
            - name: NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL
            - name: NEXT_PUBLIC_MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: NEXT_PUBLIC_MINIO_BUCKET

            # Authentication Configuration
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: NEXTAUTH_SECRET

            # Azure AD Configuration
            - name: AZURE_AD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: AZURE_AD_CLIENT_ID
            - name: AZURE_AD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: AZURE_AD_CLIENT_SECRET
            - name: AZURE_AD_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: AZURE_AD_TENANT_ID
            - name: NEXT_PUBLIC_AZURE_AD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: NEXT_PUBLIC_AZURE_AD_CLIENT_ID
            - name: NEXT_PUBLIC_AZURE_AD_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: NEXT_PUBLIC_AZURE_AD_TENANT_ID

            # API Keys
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: GOOGLE_API_KEY
            - name: PROCESSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: PROCESSOR_API_KEY
            - name: PROCESSOR_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: PROCESSOR_URL

            # Webhook Configuration
            - name: RESUME_PROCESSING_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: RESUME_PROCESSING_WEBHOOK_URL
            - name: RESUME_PROCESSING_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: RESUME_PROCESSING_WEBHOOK_TOKEN
            - name: GENERAL_PDF_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: GENERAL_PDF_WEBHOOK_URL
            - name: GENERAL_PDF_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fitscan-secrets
                  key: GENERAL_PDF_WEBHOOK_TOKEN

            # Application Configuration
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: NODE_ENV
            - name: APP_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: APP_TIMEZONE
            - name: NEXT_TELEMETRY_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: NEXT_TELEMETRY_DISABLED

            # Database Connection Pool Configuration
            - name: DATABASE_SSL
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DATABASE_SSL
            - name: DATABASE_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DATABASE_MAX_CONNECTIONS
            - name: DATABASE_IDLE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DATABASE_IDLE_TIMEOUT
            - name: DATABASE_CONNECTION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DATABASE_CONNECTION_TIMEOUT
            - name: DATABASE_STATEMENT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DATABASE_STATEMENT_TIMEOUT

            # Migration Configuration
            - name: MIGRATION_FAILURE_ACTION
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: MIGRATION_FAILURE_ACTION
            - name: SKIP_FAILED_MIGRATIONS
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: SKIP_FAILED_MIGRATIONS
            - name: DB_PUSH_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: DB_PUSH_FALLBACK
            - name: SKIP_SEED
              valueFrom:
                configMapKeyRef:
                  name: fitscan-config
                  key: SKIP_SEED

            # Production Configuration
            - name: PRODUCTION_HOST
              valueFrom:
                secretKeyRef:
                  name: fitscan-external-secrets
                  key: PRODUCTION_HOST

          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "2"
          startupProbe:
            httpGet:
              path: /api/health
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: fitscan-app-service
  namespace: ba-fitscan
  labels:
    app: fitscan-app
spec:
  selector:
    app: fitscan-app
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fitscan-app
  namespace: ba-fitscan
  labels:
    app.kubernetes.io/name: fitscan
    app.kubernetes.io/component: app
automountServiceAccountToken: true

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fitscan-app-pdb
  namespace: ba-fitscan
  labels:
    app.kubernetes.io/name: fitscan
    app.kubernetes.io/component: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fitscan-app
  unhealthyPodEvictionPolicy: IfHealthyBudget

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fitscan-resource-quota
  namespace: ba-fitscan
  labels:
    app.kubernetes.io/name: fitscan
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    persistentvolumeclaims: "4"
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: fitscan-limit-range
  namespace: ba-fitscan
  labels:
    app.kubernetes.io/name: fitscan
spec:
  limits:
    - default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: "100m"
        memory: 256Mi
      type: Container
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: "50m"
        memory: 64Mi
      type: Container
