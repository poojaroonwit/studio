name: Audit production dependencies

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev --json > /tmp/npm-audit.json || true
      - name: Print actionable audit summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('metadata', JSON.stringify(audit.metadata, null, 2));
          const rows = Object.entries(audit.vulnerabilities || {})
            .filter(([, item]) => ['high', 'critical'].includes(item.severity))
            .map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              via: (item.via || []).map(v => typeof v === 'string' ? v : `${v.source}:${v.title}`).join(' | '),
              range: item.range,
              fixAvailable: item.fixAvailable,
            }));
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Remove temporary audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-production-deps.yml
          git commit -m "chore: remove temporary dependency audit workflow"
          git push origin HEAD:fix/full-stabilization
