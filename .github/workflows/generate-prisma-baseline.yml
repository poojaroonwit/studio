name: Generate Prisma baseline

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Archive partial migration history
        run: |
          rm -rf prisma/migrations-legacy
          mv prisma/migrations prisma/migrations-legacy
          mkdir -p prisma/migrations/00000000000000_baseline
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Generate baseline from current Prisma schema
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/00000000000000_baseline/migration.sql
          test -s prisma/migrations/00000000000000_baseline/migration.sql
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-prisma-baseline.yml
          git add prisma/migrations prisma/migrations-legacy
          git commit -m "fix: establish Prisma schema baseline"
          git push origin HEAD:fix/full-stabilization
