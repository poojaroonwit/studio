name: Native mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/native-mobile.ts'
      - 'src/hooks/useHriveNativeShell.ts'
      - 'src/components/layout/NativeAwareMobileBottomNav.tsx'
      - 'src/components/pwa/PWAClientFeatures.tsx'
      - 'src/app/.well-known/**'
      - 'scripts/native-mobile-regression-checks.cjs'
      - '.github/workflows/native-mobile.yml'
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - 'src/lib/native-mobile.ts'
      - 'src/hooks/useHriveNativeShell.ts'
      - 'src/components/layout/NativeAwareMobileBottomNav.tsx'
      - 'src/components/pwa/PWAClientFeatures.tsx'
      - 'src/app/.well-known/**'
      - 'scripts/native-mobile-regression-checks.cjs'
      - '.github/workflows/native-mobile.yml'

jobs:
  mobile-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Check native TypeScript
        run: npm run type-check
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Bundle Android application
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS application
        run: npx expo export --platform ios --output-dir dist/ios
