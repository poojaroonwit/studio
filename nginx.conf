# Nginx configuration for Next.js application
# This file should be used if you're running behind nginx or similar reverse proxy

server {
    listen 80;
    server_name dev-ncc-cv-screening.qsncc.com;
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' 'unsafe-hashes'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:;";
    
    # SSE-specific configuration to prevent chunked encoding issues
    location /api/sse {
        proxy_pass http://localhost:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE-specific headers - optimized for stability without chunked encoding
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        
        # Force HTTP/1.1 without chunked encoding
        proxy_set_header Connection "keep-alive";
        proxy_set_header Keep-Alive "timeout=300, max=1000";
        
        # Completely disable chunked encoding and compression
        proxy_set_header Accept-Encoding "identity";
        proxy_set_header Transfer-Encoding "identity";
        proxy_set_header Content-Encoding "identity";
        
        # Disable all compression and encoding
        gzip off;
        gzip_vary off;
        gzip_static off;
        
        # Add CORS headers for SSE
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
        add_header Access-Control-Allow-Credentials 'true' always;
        
        # Additional headers to prevent connection issues
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
        
        # Force identity encoding to prevent chunked encoding
        add_header Content-Encoding "identity" always;
    }
    
    # Handle static assets with proper MIME types
    location /_next/static/css/ {
        proxy_pass http://localhost:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure CSS files are served with correct MIME type
        add_header Content-Type "text/css; charset=utf-8" always;
        add_header X-Content-Type-Options nosniff always;
        
        # Cache CSS files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /_next/static/chunks/ {
        proxy_pass http://localhost:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure JS files are served with correct MIME type
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header X-Content-Type-Options nosniff always;
        
        # Cache JS files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /_next/static/ {
        proxy_pass http://localhost:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Set MIME types based on file extension
        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8" always;
            add_header X-Content-Type-Options nosniff always;
        }
        
        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8" always;
            add_header X-Content-Type-Options nosniff always;
        }
        
        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Handle all other requests
    location / {
        proxy_pass http://localhost:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
