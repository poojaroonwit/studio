<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Manager - HRI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-strong: rgba(255, 255, 255, 0.9);
            --border-glass: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);

            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;

            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;

            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --gradient-mesh: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient mesh gradient blobs */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #cffafe;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: #e0e7ff;
            animation-delay: -5s;
        }

        .blob-3 {
            bottom: 20%;
            left: 20%;
            width: 30vw;
            height: 30vw;
            background: #fce7f3;
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(40px, 40px) rotate(10deg);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Glassmorphism Card Style */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-soft);
            border-radius: 20px;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            color: var(--accent-blue);
            filter: drop-shadow(0 2px 4px rgba(59, 130, 246, 0.2));
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1f2937 0%, #4b5563 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-green);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            transition: background 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .stat-card:nth-child(1):hover::before {
            background: var(--accent-cyan);
        }

        .stat-card:nth-child(2):hover::before {
            background: var(--accent-blue);
        }

        .stat-card:nth-child(3):hover::before {
            background: var(--accent-yellow);
        }

        .stat-card:nth-child(4):hover::before {
            background: var(--accent-green);
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-icon {
            padding: 6px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            letter-spacing: -1px;
            color: var(--text-primary);
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Header */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .panel-title svg {
            width: 20px;
            height: 20px;
            color: var(--accent-blue);
        }

        .panel-content {
            padding: 24px;
        }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            gap: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: white;
            border: 1px solid rgba(229, 231, 235, 0.5);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: var(--accent-blue);
        }

        .action-btn:active {
            transform: scale(0.99);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            transition: all 0.2s ease;
        }

        .action-btn:hover .btn-icon {
            background: var(--accent-blue);
            color: white;
        }

        .action-btn.danger:hover .btn-icon {
            background: var(--accent-red);
            color: white;
        }

        .action-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .action-btn.primary .btn-icon {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .action-btn.primary:hover {
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.4);
        }

        .action-info {
            flex: 1;
        }

        .action-title {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .action-desc {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .action-btn.primary .action-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Terminal */
        .terminal {
            background: #1e1e1e;
            /* Dark terminal for contrast */
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #2d2d2d;
            border-bottom: 1px solid #333;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .terminal-dot.red {
            background: #ff5f57;
        }

        .terminal-dot.yellow {
            background: #febc2e;
        }

        .terminal-dot.green {
            background: #28c840;
        }

        .terminal-body {
            padding: 16px;
            min-height: 250px;
            max-height: 300px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .terminal-line {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .terminal-prompt {
            color: #9cdcfe;
        }

        .terminal-command {
            color: #ce9178;
        }

        .terminal-success {
            color: #6a9955;
        }

        .terminal-error {
            color: #f48771;
        }

        .terminal-warning {
            color: #cca700;
        }

        .terminal-info {
            color: #569cd6;
        }

        /* Service Worker List */
        .sw-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sw-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: white;
            border: 1px solid rgba(229, 231, 235, 0.8);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .sw-icon {
            width: 42px;
            height: 42px;
            background: #ecfdf5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .sw-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sw-scope {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .sw-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: #ecfdf5;
            border: 1px solid #d1fae5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(8px);
        }

        .toast.success {
            border-left: 4px solid var(--accent-green);
        }

        .toast.error {
            border-left: 4px solid var(--accent-red);
        }

        .toast.info {
            border-left: 4px solid var(--accent-blue);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) scale(0.8);
                opacity: 0;
            }

            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            to {
                transform: translateX(100%) scale(0.8);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }

            .header-left {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-light">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="glass-panel header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div class="header-title">
                    <h1>Service Worker Manager</h1>
                    <p>Runtime Environment Dashboard</p>
                </div>
            </div>
            <div class="header-status" id="systemStatus">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">
                    <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
                        </svg></div>
                    Workers
                </div>
                <div class="stat-value" id="swCount">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path
                                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                        </svg></div>
                    Cache
                </div>
                <div class="stat-value" id="cacheCount">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
                        </svg></div>
                    Storage
                </div>
                <div class="stat-value" id="lsCount">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M12 20v-6M6 20V10M18 20V4" />
                        </svg></div>
                    Session
                </div>
                <div class="stat-value" id="ssCount">--</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Actions Panel -->
            <div class="glass-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                        Controls
                    </div>
                </div>
                <div class="panel-content">
                    <div class="actions-grid">
                        <button class="action-btn" onclick="checkStatus()">
                            <div class="btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                                    <polyline points="22 4 12 14.01 9 11.01" />
                                </svg>
                            </div>
                            <div class="action-info">
                                <span class="action-title">Refresh Status</span>
                                <span class="action-desc">Update system metrics</span>
                            </div>
                        </button>

                        <button class="action-btn" onclick="unregisterServiceWorker()">
                            <div class="btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect width="18" height="18" x="3" y="3" rx="2" />
                                    <path d="M9 9h6M9 12h6M9 15h6" />
                                </svg>
                            </div>
                            <div class="action-info">
                                <span class="action-title">Unregister Workers</span>
                                <span class="action-desc">Remove SW registrations</span>
                            </div>
                        </button>

                        <button class="action-btn" onclick="clearCache()">
                            <div class="btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                                    <line x1="9" y1="9" x2="15" y2="15" />
                                    <line x1="15" y1="9" x2="9" y2="15" />
                                </svg>
                            </div>
                            <div class="action-info">
                                <span class="action-title">Clear Cache</span>
                                <span class="action-desc">Purge application cache</span>
                            </div>
                        </button>

                        <button class="action-btn danger" onclick="clearAll()">
                            <div class="btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M3 6h18" />
                                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                                    <line x1="10" y1="11" x2="10" y2="17" />
                                    <line x1="14" y1="11" x2="14" y2="17" />
                                </svg>
                            </div>
                            <div class="action-info">
                                <span class="action-title">Nuclear Reset</span>
                                <span class="action-desc">Clear everything & reload</span>
                            </div>
                        </button>

                        <button class="action-btn primary" onclick="goHome()">
                            <div class="btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                    <polyline points="9 22 9 12 15 12 15 22" />
                                </svg>
                            </div>
                            <div class="action-info">
                                <span class="action-title">Return Home</span>
                                <span class="action-desc">Go back to dashboard</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminal Panel -->
            <div class="glass-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5" />
                            <line x1="12" y1="19" x2="20" y2="19" />
                        </svg>
                        System Console
                    </div>
                </div>
                <div class="panel-content">
                    <div class="terminal">
                        <div class="terminal-header">
                            <span class="terminal-dot red"></span>
                            <span class="terminal-dot yellow"></span>
                            <span class="terminal-dot green"></span>
                        </div>
                        <div class="terminal-body" id="terminalOutput">
                            <div class="terminal-line">
                                <span class="terminal-prompt">❯</span>
                                <span class="terminal-info">initializing system...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="glass-panel" style="grid-column: 1 / -1; margin-top: 0;">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="16" x2="12" y2="12" />
                            <line x1="12" y1="8" x2="12.01" y2="8" />
                        </svg>
                        Registration Details
                    </div>
                </div>
                <div class="panel-content">
                    <div id="swList" class="sw-list"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>HRI Service Worker Manager • v2.1.0 (Glass UI)</p>
        </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Terminal logging
        function terminalLog(message, type = 'info') {
            const terminal = document.getElementById('terminalOutput');
            const line = document.createElement('div');
            line.className = 'terminal-line';

            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
            let typeClass = `terminal-${type}`;

            line.innerHTML = `
                <span class="terminal-prompt">[${timestamp}]</span>
                <span class="${typeClass}">${message}</span>
            `;

            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function terminalCommand(cmd) {
            const terminal = document.getElementById('terminalOutput');
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerHTML = `
                <span class="terminal-prompt">❯</span>
                <span class="terminal-command">${cmd}</span>
            `;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };

            // deepcode ignore DOMXSS: Only trusted system messages are displayed here
            toast.innerHTML = `${icons[type]}<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.4s ease forwards';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // Update stats
        function updateStats(swCount, cacheCount) {
            document.getElementById('swCount').textContent = swCount;
            document.getElementById('cacheCount').textContent = cacheCount;
            document.getElementById('lsCount').textContent = localStorage.length;
            document.getElementById('ssCount').textContent = sessionStorage.length;
        }

        // Render service worker list
        function renderSwList(registrations) {
            const container = document.getElementById('swList');

            if (registrations.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                        <p>No registered service workers found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = registrations.map((reg, i) => `
                <div class="sw-item">
                    <div class="sw-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div style="flex:1">
                        <div class="sw-name">Worker Instance #${i + 1}</div>
                        <div class="sw-scope">${reg.scope}</div>
                    </div>
                    <div class="sw-status">Active</div>
                </div>
            `).join('');
        }

        async function unregisterServiceWorker() {
            terminalCommand('sw.unregister()');

            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();

                    if (registrations.length === 0) {
                        terminalLog('No service workers found', 'warning');
                        showToast('No service workers found', 'info');
                        return;
                    }

                    for (const registration of registrations) {
                        await registration.unregister();
                        terminalLog(`Unregistered: ${registration.scope}`, 'success');
                    }

                    showToast(`Unregistered ${registrations.length} worker(s)`, 'success');
                    await checkStatus();
                } else {
                    terminalLog('Service workers not supported', 'error');
                }
            } catch (error) {
                terminalLog(`Error: ${error.message}`, 'error');
                showToast(`Error: ${error.message}`, 'error');
            }
        }

        async function clearCache() {
            terminalCommand('cache.clear()');

            try {
                if ('caches' in window) {
                    const cacheNames = await caches.keys();

                    if (cacheNames.length === 0) {
                        terminalLog('No caches found', 'warning');
                        showToast('Empty cache', 'info');
                        return;
                    }

                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        terminalLog(`Deleted cache: ${cacheName}`, 'success');
                    }

                    showToast(`Cleared ${cacheNames.length} cache(s)`, 'success');
                    await checkStatus();
                } else {
                    terminalLog('Cache API not supported', 'error');
                }
            } catch (error) {
                terminalLog(`Error: ${error.message}`, 'error');
                showToast(`Error: ${error.message}`, 'error');
            }
        }

        async function clearAll() {
            terminalCommand('system.reset()');
            terminalLog('Initiating nuclear reset...', 'warning');

            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) await registration.unregister();
                }

                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) await caches.delete(cacheName);
                }

                localStorage.clear();
                sessionStorage.clear();

                showToast('Reset complete! Reloading...', 'success');
                terminalLog('Reloading application...', 'info');

                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                terminalLog(`Error: ${error.message}`, 'error');
                showToast(error.message, 'error');
            }
        }

        async function checkStatus() {
            terminalCommand('system.status()');

            try {
                let swCount = 0;
                let cacheCount = 0;
                let registrations = [];

                if ('serviceWorker' in navigator) {
                    registrations = await navigator.serviceWorker.getRegistrations();
                    swCount = registrations.length;
                    terminalLog(`Workers: ${swCount} registered`, 'info');
                }

                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    cacheCount = cacheNames.length;
                    terminalLog(`Cache: ${cacheCount} keys`, 'info');
                }

                updateStats(swCount, cacheCount);
                renderSwList(registrations);

                terminalLog('System healthy', 'success');
            } catch (error) {
                terminalLog(error.message, 'error');
            }
        }

        function goHome() {
            window.location.href = '/';
        }

        window.addEventListener('load', async () => {
            terminalLog('Initializing UI...', 'info');
            await checkStatus();
            terminalLog('Ready', 'success');
        });
    </script>
</body>

</html>
