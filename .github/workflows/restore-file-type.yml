name: Restore patched file-type dependency

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global npm@11.6.2
      - name: Add patched file-type and regenerate lock
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['file-type'] = '22.0.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
      - name: Verify production audit severity
        run: npm audit --omit=dev --audit-level=high
      - name: Commit manifest and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: restore patched file-type dependency"
          git push origin HEAD:fix/full-stabilization
