name: Hrive commercial metadata cleanup

on:
  push:
    branches: ['feat/hrive-outborn-core-integration']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/hrive-outborn-core-integration
      - name: Update commercial navigation and deployment docs
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/app/settings/settings-page-model.ts')
          text = model.read_text()
          old = """  {
            href: '/settings/policy-configuration?area=billing',
            label: 'Billing Preferences',
            description: 'Manage billing contacts, invoice preferences, purchase-order requirements, and renewal alerts.',
            tab: 'Billing',
            section: 'Billing Administration',
            value: 'Configure',
            permissionId: 'SYSTEM_SETTINGS_VIEW',
            adminOnlyOrPermission: true,
          },"""
          new = """  {
            href: '/settings/billing',
            label: 'Billing & Plan',
            description: 'Manage the shared Outborn subscription, invoices, usage, entitlements, and billing details.',
            tab: 'Billing',
            section: 'Billing Administration',
            value: 'Manage',
            permissionId: 'SYSTEM_SETTINGS_VIEW',
            adminOnlyOrPermission: true,
          },"""
          if old not in text:
              raise SystemExit('Legacy billing settings item was not found')
          model.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          env_old = """OUTBORN_ACCOUNT_AUTH_URL=https://account.example.com
          OUTBORN_HRIVE_WEB_CLIENT_ID=outborn-hrive-web
          OUTBORN_CORE_URL=https://core.example.com"""
          env_new = env_old + "\nOUTBORN_SERVICE_REQUEST_TIMEOUT_MS=7000"
          if env_old in text and 'OUTBORN_SERVICE_REQUEST_TIMEOUT_MS=7000' not in text:
              text = text.replace(env_old, env_new, 1)

          auth_old = "Hrive keeps the Account OAuth access token only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes; it never receives the Account bearer token or Stripe secrets."
          auth_new = """Before first production sign-in, register Hrive as an Outborn Account public PKCE client. From `outborn-core/apps/account-web`, run:

          ```bash
          OUTBORN_OAUTH_CLIENT_ID=outborn-hrive-web \\
          OUTBORN_OAUTH_CLIENT_NAME=Hrive \\
          OUTBORN_OAUTH_REDIRECT_URIS=https://your-app.example.com/api/auth/callback/outborn-account \\
          OUTBORN_OAUTH_CLIENT_REGISTER_APPLY=true \\
          npm run auth:register-product-client
          ```

          The Account registrar enables authorization-code + refresh-token grants, PKCE, `offline_access`, and organization scopes for this public client. Hrive keeps the Account OAuth access and refresh tokens only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes; it never receives Account bearer credentials or Stripe secrets."""
          if auth_old in text:
              text = text.replace(auth_old, auth_new, 1)
          readme.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/app/settings/settings-page-model.ts
          git commit -m "refactor: remove legacy billing navigation metadata"
          git push origin HEAD:feat/hrive-outborn-core-integration
