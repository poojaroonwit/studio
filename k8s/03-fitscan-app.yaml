apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitscan-app-deployment
  namespace: ba-fitscan
  labels:
    app: fitscan-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitscan-app
  template:
    metadata:
      labels:
        app: fitscan-app
    spec:
      containers:
        - name: fitscan-app
          image: your-registry.example.com/fitscan:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8021
          envFrom:
            - configMapRef:
                name: fitscan-config
            - secretRef:
                name: fitscan-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"

---
apiVersion: v1
kind: Service
metadata:
  name: fitscan-app-service
  namespace: ba-fitscan
  labels:
    app: fitscan-app
spec:
  selector:
    app: fitscan-app
  ports:
    - name: http
      port: 80
      targetPort: 8021
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitscan-app-hpa
  namespace: ba-fitscan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fitscan-app-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
