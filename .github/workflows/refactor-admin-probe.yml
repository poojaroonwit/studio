name: Refactor admin probe chart

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refactor-admin-probe.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Extract probe chart component
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/app/settings/AdminCenterOverview.tsx')
          component_path = Path('src/app/settings/AdminCenterProbeChart.tsx')
          source = source_path.read_text()
          start = source.index('function ProbeChart(')
          end = source.index('function SetupGauge(', start)
          block = source[start:end].rstrip()
          block = block.replace('function ProbeChart(', 'export function AdminCenterProbeChart(', 1)

          component = '''"use client";\n\nimport { useMemo, useState } from 'react';\n\nimport type { HealthProbePoint } from './admin-center-overview-model';\n\n''' + block + '\n'
          component_path.write_text(component)

          source = source[:start] + source[end:]
          source = source.replace('<ProbeChart probes={probes} />', '<AdminCenterProbeChart probes={probes} />')
          import_anchor = "import type { SettingsPageItem } from './settings-page-model';\n"
          source = source.replace(import_anchor, import_anchor + "import { AdminCenterProbeChart } from './AdminCenterProbeChart';\n")
          source_path.write_text(source)
          PY
      - name: Verify decomposition
        run: |
          test "$(wc -l < src/app/settings/AdminCenterOverview.tsx)" -le 500
          grep -q 'export function AdminCenterProbeChart' src/app/settings/AdminCenterProbeChart.tsx
          grep -q '<AdminCenterProbeChart probes={probes} />' src/app/settings/AdminCenterOverview.tsx
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo 'No refactor changes needed.'
            exit 0
          fi
          git config user.name 'Jaroonwit poolnai'
          git config user.email 'jaroonwit.pool@gmail.com'
          git add src/app/settings/AdminCenterOverview.tsx src/app/settings/AdminCenterProbeChart.tsx
          git commit -m 'refactor: split live probe chart from admin center'
          git push origin HEAD:dev
