name: Native mobile

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mobile/**'
      - 'src/components/pwa/NativeMobileRuntime.tsx'
      - 'src/lib/native-mobile.ts'
      - 'src/lib/native-mobile-device-registry.ts'
      - 'src/lib/native-push.ts'
      - 'src/app/api/mobile/**'
      - 'src/app/ess/mobile-settings/**'
      - 'src/app/.well-known/**'
      - '.github/workflows/native-mobile.yml'
      - '.github/workflows/native-release.yml'
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - 'src/components/pwa/NativeMobileRuntime.tsx'
      - 'src/lib/native-mobile.ts'
      - 'src/lib/native-mobile-device-registry.ts'
      - 'src/lib/native-push.ts'
      - 'src/app/api/mobile/**'
      - 'src/app/ess/mobile-settings/**'
      - 'src/app/.well-known/**'
      - '.github/workflows/native-mobile.yml'
      - '.github/workflows/native-release.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/check-native-mobile.cjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate and configure Android project
        working-directory: mobile
        env:
          NATIVE_PLATFORM: android
        run: npm run native:prepare
      - name: Compile Android debug app
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Stage BrowserStack APK
        run: |
          mkdir -p mobile/build/browserstack
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/build/browserstack/hrive-latest.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrive-android-debug-apk
          path: mobile/build/browserstack/hrive-latest.apk
          if-no-files-found: error
          retention-days: 14

  publish-android-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [architecture, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v5
        with:
          name: hrive-android-debug-apk
          path: dist
      - name: Publish stable BrowserStack APK URL
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: hrive-android-latest
          APK_PATH: dist/hrive-latest.apk
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          NOTES="Automated Hrive Android debug build from dev commit ${GITHUB_SHA}. Intended for BrowserStack/App Live and cloud-device testing."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Hrive Android latest" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hrive Android latest" --notes "$NOTES" --prerelease
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/hrive-latest.apk"
          echo "### Hrive Android cloud-device build" >> "$GITHUB_STEP_SUMMARY"
          echo "BrowserStack/App Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --location --silent --show-error --head "$URL" >/dev/null

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate and configure iOS project
        working-directory: mobile
        env:
          NATIVE_PLATFORM: ios
        run: npm run native:prepare
      - name: Compile iOS simulator app
        working-directory: mobile
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
