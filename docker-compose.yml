services:
  app:
    # image: studio-6-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    ports:
      - "${APP_PORT:-8021}:8021"
    # For production deployments, you typically want the application code to be self-contained
    # within the Docker image. The volume mount `.:/app` is primarily for local development to
    # reflect code changes without rebuilding the image. It's commented out for production-like behavior.
    # If this mount is active in a production-like environment (e.g., Portainer deploying from an image
    # or a CI/CD pipeline), and the host path "." does not contain your application code (including package.json),
    # it will overwrite the files copied into the image, leading to "package.json not found" errors.
    # volumes:
    #   - .:/app # Ensure this is commented out or removed for production deployments where the image is self-contained.
    #
    # The named volumes below are generally fine and can be useful for persisting
    # node_modules and the .next build cache across container restarts, potentially
    # speeding up subsequent starts if the underlying image hasn't changed significantly.
    # volumes:
      # - app_node_modules:/app/node_modules
      # - app_next:/app/.next
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Azure AD Configuration (Optional - set these only if you want to use Azure AD SSO)
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      # Public Azure AD variables for client-side detection (Optional)
      NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
      # RESUME_PROCESSING_WEBHOOK_URL is the generic fallback for resume processing webhook
      RESUME_PROCESSING_WEBHOOK_URL: ${RESUME_PROCESSING_WEBHOOK_URL}
      RESUME_PROCESSING_WEBHOOK_TOKEN: ${RESUME_PROCESSING_WEBHOOK_TOKEN}
      # GENERAL_PDF_WEBHOOK_URL is used for automated candidate creation from PDF resumes
      GENERAL_PDF_WEBHOOK_URL: ${GENERAL_PDF_WEBHOOK_URL}
      GENERAL_PDF_WEBHOOK_TOKEN: ${GENERAL_PDF_WEBHOOK_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NEXT_PUBLIC_GOOGLE_FONTS_API_KEY: ${NEXT_PUBLIC_GOOGLE_FONTS_API_KEY}
      NODE_ENV: ${NODE_ENV}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY}
      PROCESSOR_URL: ${PROCESSOR_URL}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    # The command to run the application is defined in the Dockerfile's CMD instruction
    # which uses wait-for-db.sh for optimized startup
    networks:
      - docker_internal
      - default

  postgres:
    image: postgres:14-alpine
    ports:
      - "${POSTGRES_PORT:-8521}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Ensure proper initialization
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    # volumes:
    #   - /var/dockers/8021/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Resource limits
    mem_limit: 512m
    cpus: 0.25
    networks:
      - docker_internal

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9847}:9000" # MinIO API port
      - "${MINIO_CONSOLE_PORT:-9848}:9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MINIO_SERVER_URL: http://localhost:9000
      # MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_PUBLIC_BASE_URL}

      # #–– public URL so presigned links stay HTTPS ––
      MINIO_SERVER_URL: ${MINIO_PUBLIC_BASE_URL}
      
      #–– CORS done 100 % here –– (⇠ NO spaces!)
      MINIO_API_CORS_ALLOW_ORIGIN:  ${PRODUCTION_HOST}
      MINIO_API_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE
      MINIO_API_CORS_ALLOW_HEADERS: Authorization,Content-Type,X-Amz-Date,X-Amz-Content-Sha256,X-Amz-Security-Token,X-Requested-With

    command: server /data --console-address ":9001" --address ":9000"
    # volumes:
    #   - /var/dockers/8021/minio_data:/data
    restart: unless-stopped
    # Resource limits
    mem_limit: 512m
    cpus: 0.25
    networks:
      - docker_internal

  upload-queue-processor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/process-upload-queue-with-server.js"]
    ports:
      - "${PROCESSOR_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
      RESUME_PROCESSING_WEBHOOK_URL: ${RESUME_PROCESSING_WEBHOOK_URL}
      RESUME_PROCESSING_WEBHOOK_TOKEN: ${RESUME_PROCESSING_WEBHOOK_TOKEN}
      GENERAL_PDF_WEBHOOK_URL: ${GENERAL_PDF_WEBHOOK_URL}
      GENERAL_PDF_WEBHOOK_TOKEN: ${GENERAL_PDF_WEBHOOK_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NEXT_PUBLIC_GOOGLE_FONTS_API_KEY: ${NEXT_PUBLIC_GOOGLE_FONTS_API_KEY}
      NODE_ENV: ${NODE_ENV}
      PROCESSOR_INTERVAL_MS: ${PROCESSOR_INTERVAL_MS}
      LOG_INTERVAL_MS: ${LOG_INTERVAL_MS}
      PROCESSOR_URL: ${PROCESSOR_URL}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY}
    depends_on:
      - app
      - postgres
      - minio
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    networks:
      - docker_internal

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-8921}:5678"
    environment:
      # Database configuration (using the same PostgreSQL instance)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      
      # N8N configuration
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-your-encryption-key-here}
      
      # Webhook configuration
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      
      # Execution settings
      EXECUTIONS_PROCESS: ${N8N_EXECUTIONS_PROCESS:-main}
      EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE:-regular}
      
      # Logging
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      
      # Security
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_SESSION_COOKIE_SECURE: ${N8N_SESSION_COOKIE_SECURE:-false}
      
      # Timezone
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
    # volumes:
    #   - /var/dockers/8021/n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    networks:
      - docker_internal


networks:
  default:
    external:
      name: docker_external
  docker_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.21.0/24
          gateway: 172.20.21.1

