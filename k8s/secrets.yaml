apiVersion: v1
kind: Secret
metadata:
  name: fitscan-secrets
  namespace: fitscan
type: Opaque
data:
  # Database credentials (base64 encoded)
  # WARNING: Replace these with your actual secure base64 encoded values
  # These are example values and should NOT be used in production
  POSTGRES_USER: cG9zdGdyZXM=  # postgres (CHANGE THIS)
  POSTGRES_PASSWORD: c2VjdXJlX3Bhc3N3b3Jk  # secure_password (CHANGE THIS)
  
  # MinIO credentials (base64 encoded)
  # WARNING: Replace these with your actual secure base64 encoded values
  # These are example values and should NOT be used in production
  MINIO_ROOT_USER: bWluaW9hY2Nlc3NrZXk=  # minioaccesskey (CHANGE THIS)
  MINIO_ROOT_PASSWORD: bWluaW9zZWNyZXRrZXk=  # miniosecretkey (CHANGE THIS)
  MINIO_ACCESS_KEY: bWluaW9hY2Nlc3NrZXk=  # minioaccesskey (CHANGE THIS)
  MINIO_SECRET_KEY: bWluaW9zZWNyZXRrZXk=  # miniosecretkey (CHANGE THIS)
  
  # Authentication secrets (base64 encoded)
  NEXTAUTH_SECRET: MmxrZmxjQ3lEenoyZUUrd2RsczNDdDEzL3ZHQ01xdkVnRUZFTldkR0taaXBLb0tLOFpIQVJkQ0dubG89  # 2lkflcCyDzl2eE+wdls3Ct13/vGCMqvQgEFENWdGKZipKoKK8ZHARdCGnlo=
  
  # API Keys (base64 encoded - replace with your actual keys)
  GOOGLE_API_KEY: eW91ci1nb29nbGUtYXBpLWtleQ==  # your-google-api-key
  PROCESSOR_API_KEY: eW91ci1wcm9jZXNzb3ItYXBpLWtleQ==  # your-processor-api-key
  
  # Webhook tokens (base64 encoded - replace with your actual tokens)
  RESUME_PROCESSING_WEBHOOK_TOKEN: eW91ci1yZXN1bWUtcHJvY2Vzc2luZy13ZWJob29rLXRva2Vu  # your-resume-processing-webhook-token
  GENERAL_PDF_WEBHOOK_TOKEN: eW91ci1nZW5lcmFsLXBkZi13ZWJob29rLXRva2Vu  # your-general-pdf-webhook-token
  
  # Azure AD Configuration (base64 encoded - replace with your actual values)
  AZURE_AD_CLIENT_ID: eW91ci1henVyZS1hZC1jbGllbnQtaWQ=  # your-azure-ad-client-id
  AZURE_AD_CLIENT_SECRET: eW91ci1henVyZS1hZC1jbGllbnQtc2VjcmV0  # your-azure-ad-client-secret
  AZURE_AD_TENANT_ID: eW91ci1henVyZS1hZC10ZW5hbnQtaWQ=  # your-azure-ad-tenant-id

---
# Additional secrets for external URLs and tokens
apiVersion: v1
kind: Secret
metadata:
  name: fitscan-external-secrets
  namespace: fitscan
type: Opaque
stringData:
  # These will be automatically base64 encoded by Kubernetes
  NEXTAUTH_URL: "https://your-domain.com"
  MINIO_PUBLIC_BASE_URL: "https://your-domain.com:9001"
  NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: "https://your-domain.com:9001"
  NEXT_PUBLIC_MINIO_BUCKET: "studio-production"
  NEXT_PUBLIC_MINIO_URL: "https://your-domain.com:9001"
  NEXT_PUBLIC_MINIO_BUCKET_NAME: "studio-production"
  PRODUCTION_HOST: "https://your-domain.com"
  PROCESSOR_URL: "https://your-domain.com/api/upload-queue/process"
  UPLOAD_QUEUE_PROCESS_URL: "https://your-domain.com/api/upload-queue/process"
  RESUME_PROCESSING_WEBHOOK_URL: "https://ncc-dify.qsncc.com/v1/workflows/run"
  GENERAL_PDF_WEBHOOK_URL: "https://ncc-dify.qsncc.com/v1/workflows/run"
  NEXT_PUBLIC_AZURE_AD_CLIENT_ID: "your-azure-ad-client-id"
  NEXT_PUBLIC_AZURE_AD_TENANT_ID: "your-azure-ad-tenant-id"
