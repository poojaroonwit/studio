name: Hrive post-merge cleanup

on:
  push:
    branches:
      - cleanup/hrive-post-core-merge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/hrive-post-core-merge

      - name: Clean commercial metadata and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/app/settings/settings-page-model.ts')
          text = model.read_text()
          replacements = [
              ("href: '/settings/policy-configuration?area=billing'", "href: '/settings/billing'"),
              ("label: 'Billing Preferences'", "label: 'Billing & Plan'"),
              (
                  "description: 'Manage billing contacts, invoice preferences, purchase-order requirements, and renewal alerts.'",
                  "description: 'Manage the shared Outborn subscription, invoices, usage, entitlements, and billing details.'",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          billing_href = "href: '/settings/billing'"
          start = text.find(billing_href)
          if start < 0:
              raise SystemExit('Billing settings metadata was not found')
          end = text.find('\n  },', start)
          if end < 0:
              raise SystemExit('Billing settings metadata block is malformed')
          block = text[start:end]
          if "value: 'Configure'" in block:
              block = block.replace("value: 'Configure'", "value: 'Manage'", 1)
              text = text[:start] + block + text[end:]
          model.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          core_url = 'OUTBORN_CORE_URL=https://core.example.com'
          timeout_line = 'OUTBORN_SERVICE_REQUEST_TIMEOUT_MS=7000'
          if timeout_line not in text:
              if core_url not in text:
                  raise SystemExit('Outborn Core environment example is missing')
              text = text.replace(core_url, core_url + '\n' + timeout_line, 1)

          old_paragraph = "Hrive keeps the Account OAuth access token only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes; it never receives the Account bearer token or Stripe secrets."
          if old_paragraph in text:
              new_paragraph = """Before first production sign-in, register Hrive as an Outborn Account public PKCE client from `outborn-core/apps/account-web`:

```bash
OUTBORN_OAUTH_CLIENT_ID=outborn-hrive-web \\
OUTBORN_OAUTH_CLIENT_NAME=Hrive \\
OUTBORN_OAUTH_REDIRECT_URIS=https://your-app.example.com/api/auth/callback/outborn-account \\
OUTBORN_OAUTH_CLIENT_REGISTER_APPLY=true \\
npm run auth:register-product-client
```

The registrar enables authorization-code and refresh-token grants, PKCE, `offline_access`, and organization scopes. Hrive keeps Account access and refresh tokens only inside Auth.js's encrypted server JWT. Browser code calls Hrive's same-origin `/api/outborn-core/*` BFF routes and never receives Account bearer credentials or Stripe secrets."""
              text = text.replace(old_paragraph, new_paragraph, 1)
          readme.write_text(text)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/app/settings/settings-page-model.ts
          git commit -m "refactor: clean merged Outborn commercial metadata"
          git push origin HEAD:cleanup/hrive-post-core-merge
