name: Hrive refactor focused tests

on:
  pull_request:

jobs:
  focused-models:
    if: ${{ github.head_ref == 'refactor/hrive-large-modules' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: >-
          npx vitest run
          src/lib/learning/record-utils.test.ts
          src/lib/payroll/workspace-model.test.ts
          src/lib/hr/employee-profile-model.test.ts
          src/lib/leaves/leave-allocation-draft.test.ts
