name: Hrive Learning decomposition codemod

on:
  push:
    branches:
      - refactor/hrive-component-decomposition

permissions:
  contents: write

jobs:
  extract-learning-overview:
    if: ${{ !contains(github.event.head_commit.message, '[hrive-decompose-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/hrive-component-decomposition
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: node scripts/codemods/extract-learning-overview.mjs
      - run: node scripts/learning-component-decomposition-regression-checks.cjs
      - run: npm run type-check
      - run: npx eslint src/app/learning/LearningPageClient.tsx src/app/learning/LearningOverview.tsx --max-warnings=0
      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/learning/LearningPageClient.tsx src/app/learning/LearningOverview.tsx
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
          else
            git commit -m "refactor: extract Learning overview [hrive-decompose-bot]"
            git pull --rebase origin refactor/hrive-component-decomposition
            git push origin HEAD:refactor/hrive-component-decomposition
          fi
