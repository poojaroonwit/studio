name: Quality gates

on:
  pull_request:
  push:
    branches: [main, master, uat, dev]

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  database-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U studio -d studio_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://studio:studio@127.0.0.1:5432/studio_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
      - name: Enable required PostgreSQL extensions
        run: npx prisma db execute --schema=prisma/schema.prisma --file=scripts/ensure-postgresql-extensions.sql
      - name: Deploy migrations to clean database
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Verify migration status
        run: npx prisma migrate status --schema=prisma/schema.prisma
      - name: Verify migration result matches schema
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          NEXTAUTH_SECRET: ci-only-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:8021
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
