name: Hrive Time integration

on:
  push:
    branches:
      - feat/hrive-time-e2e-completion

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[time-integration-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/hrive-time-e2e-completion
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/codemods/complete-time-contracts-and-corrections.mjs
      - run: npx vitest run src/lib/hr/attendance-correction.test.ts src/lib/hr/shift-request-workflow.test.ts src/lib/hr/overtime-request-workflow.test.ts src/lib/hr/roster-copy.test.ts src/lib/hr/shift-notification-recipients.test.ts src/lib/hr/time-policy-config.test.ts src/lib/payroll/attendance-inputs.test.ts
      - run: npm run type-check
      - run: npx eslint src/lib/hr/attendance-correction.ts src/lib/hr/ess-contracts.ts src/lib/hr/ess-request-service.ts src/lib/hr/shift-attendance-contracts.ts --max-warnings=0
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/hr/ess-contracts.ts src/lib/hr/ess-request-service.ts src/lib/hr/shift-attendance-contracts.ts
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat: integrate Time correction and lifecycle contracts [time-integration-bot]"
            git pull --rebase origin feat/hrive-time-e2e-completion
            git push origin HEAD:feat/hrive-time-e2e-completion
          fi
