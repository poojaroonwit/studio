  #   networks:
  #     - docker_internal

  # Upload Queue Processor Service
  upload-queue-processor:
    container_name: 8021_fitscan_process_queue
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "/bin/sh", "/app/entrypoint-processor.sh" ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY:-dev-key}
      PROCESSOR_URL: ${PROCESSOR_URL:-http://8021_fitscan_app:8021}
      UPLOAD_QUEUE_PROCESS_URL: ${UPLOAD_QUEUE_PROCESS_URL:-http://8021_fitscan_app:8021/api/upload-queue/process}
      PROCESSOR_INTERVAL_MS: ${PROCESSOR_INTERVAL_MS:-2000}
      LOG_INTERVAL_MS: ${LOG_INTERVAL_MS:-5000}
      PROCESSOR_QUIET_MODE: ${PROCESSOR_QUIET_MODE:-true}
      PROCESSOR_CONNECTION_TIMEOUT_MS: ${PROCESSOR_CONNECTION_TIMEOUT_MS:-5000}
      PROCESSOR_REQUEST_TIMEOUT_MS: ${PROCESSOR_REQUEST_TIMEOUT_MS:-120000}
      NODE_ENV: ${NODE_ENV}
      DOCKER_ENV: true
    # NOTE: Using external PostgreSQL, no local postgres dependency
    depends_on:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - docker_internal

networks:
  default:
    driver: bridge
  docker_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.30.0/24
          gateway: 172.25.30.1
