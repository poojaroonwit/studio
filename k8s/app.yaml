apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitscan-app
  namespace: fitscan
  labels:
    app: fitscan-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitscan-app
  template:
    metadata:
      labels:
        app: fitscan-app
    spec:
      containers:
      - name: fitscan-app
        image: fitscan:latest  # Replace with your actual image name and tag
        ports:
        - containerPort: 8021
          name: http
        env:
        # Database Configuration
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: POSTGRES_PORT
        
        # MinIO Configuration
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: MINIO_ENDPOINT
        - name: MINIO_PORT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: MINIO_PORT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: MINIO_SECRET_KEY
        - name: MINIO_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: MINIO_BUCKET_NAME
        - name: MINIO_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: MINIO_USE_SSL
        - name: MINIO_PUBLIC_BASE_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: MINIO_PUBLIC_BASE_URL
        - name: NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL
        
        # Authentication Configuration
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXTAUTH_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: NEXTAUTH_SECRET
        
        # Azure AD Configuration
        - name: AZURE_AD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: AZURE_AD_CLIENT_ID
        - name: AZURE_AD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: AZURE_AD_CLIENT_SECRET
        - name: AZURE_AD_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: AZURE_AD_TENANT_ID
        - name: NEXT_PUBLIC_AZURE_AD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_AZURE_AD_CLIENT_ID
        - name: NEXT_PUBLIC_AZURE_AD_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_AZURE_AD_TENANT_ID
        
        # API Keys
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: GOOGLE_API_KEY
        - name: PROCESSOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: PROCESSOR_API_KEY
        - name: PROCESSOR_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: PROCESSOR_URL
        
        # Webhook Configuration
        - name: RESUME_PROCESSING_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: RESUME_PROCESSING_WEBHOOK_URL
        - name: RESUME_PROCESSING_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: RESUME_PROCESSING_WEBHOOK_TOKEN
        - name: GENERAL_PDF_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: GENERAL_PDF_WEBHOOK_URL
        - name: GENERAL_PDF_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: fitscan-secrets
              key: GENERAL_PDF_WEBHOOK_TOKEN
        
        # Application Configuration
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: NODE_ENV
        - name: APP_PORT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: APP_PORT
        - name: APP_TIMEZONE
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: APP_TIMEZONE
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: NEXT_TELEMETRY_DISABLED
        
        # Database Connection Pool Configuration
        - name: DATABASE_SSL
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DATABASE_SSL
        - name: DATABASE_MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DATABASE_MAX_CONNECTIONS
        - name: DATABASE_IDLE_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DATABASE_IDLE_TIMEOUT
        - name: DATABASE_CONNECTION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DATABASE_CONNECTION_TIMEOUT
        - name: DATABASE_STATEMENT_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DATABASE_STATEMENT_TIMEOUT
        
        # Migration Configuration
        - name: MIGRATION_FAILURE_ACTION
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: MIGRATION_FAILURE_ACTION
        - name: SKIP_FAILED_MIGRATIONS
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: SKIP_FAILED_MIGRATIONS
        - name: DB_PUSH_FALLBACK
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DB_PUSH_FALLBACK
        - name: SKIP_SEED
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: SKIP_SEED
        
        # Database Wait Configuration
        - name: DB_MAX_WAIT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DB_MAX_WAIT_SECONDS
        - name: DB_WAIT_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: fitscan-config
              key: DB_WAIT_INTERVAL
        
        # Public MinIO Configuration
        - name: NEXT_PUBLIC_MINIO_BUCKET
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_MINIO_BUCKET
        - name: NEXT_PUBLIC_MINIO_URL
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_MINIO_URL
        - name: NEXT_PUBLIC_MINIO_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: NEXT_PUBLIC_MINIO_BUCKET_NAME
        
        # Production Configuration
        - name: PRODUCTION_HOST
          valueFrom:
            secretKeyRef:
              name: fitscan-external-secrets
              key: PRODUCTION_HOST
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8021
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8021
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: fitscan-app-service
  namespace: fitscan
  labels:
    app: fitscan-app
spec:
  selector:
    app: fitscan-app
  ports:
  - port: 8021
    targetPort: 8021
    protocol: TCP
    name: http
  type: ClusterIP
