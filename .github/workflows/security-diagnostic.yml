name: Security diagnostic

on:
  push:
    branches: [fix/full-stabilization]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - name: High and critical production advisories
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(audit.metadata));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            if (!['critical', 'high'].includes(item.severity)) continue;
            console.log('AUDIT_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map(v => typeof v === 'string' ? v : ({source:v.source,name:v.name,title:v.title,severity:v.severity,range:v.range,url:v.url})),
            }));
          }
          NODE
      - name: Current registry versions for direct security roots
        run: |
          for package in next next-auth @auth/core nodemailer sharp file-type uuid fast-xml-parser axios; do
            printf 'REGISTRY %s latest=' "$package"
            npm view "$package" version || true
          done
