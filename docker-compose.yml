services:
  app:
    container_name: 8021_fitscan_app
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-8021}:8021"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL}
      # SECURITY: Enforce private bucket and signed URLs (CRITICAL!)
      ALLOW_PUBLIC_FILES: ${ALLOW_PUBLIC_FILES:-false}
      USE_SIGNED_URLS_IN_WEBHOOKS: ${USE_SIGNED_URLS_IN_WEBHOOKS:-false}
      # Auto-enforce security on startup
      AUTO_ENFORCE_BUCKET_SECURITY: ${AUTO_ENFORCE_BUCKET_SECURITY:-true}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      # Azure AD Configuration (Optional - set these only if you want to use Azure AD SSO)
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      # Public Azure AD variables for client-side detection (Optional)
      NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
      # RESUME_PROCESSING_WEBHOOK_URL is the generic fallback for resume processing webhook
      RESUME_PROCESSING_WEBHOOK_URL: ${RESUME_PROCESSING_WEBHOOK_URL}
      RESUME_PROCESSING_WEBHOOK_TOKEN: ${RESUME_PROCESSING_WEBHOOK_TOKEN}

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      NODE_ENV: ${NODE_ENV}
      PROCESSOR_API_KEY: ${PROCESSOR_API_KEY}
      PROCESSOR_URL: ${PROCESSOR_URL}
      DATABASE_CONNECTION_TIMEOUT: ${DATABASE_CONNECTION_TIMEOUT:-600000}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-90}
      DATABASE_IDLE_TIMEOUT: ${DATABASE_IDLE_TIMEOUT:-5000}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

      SKIP_SEED: ${SKIP_SEED:-false}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      # N8N Database variables (for database creation)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCTION_HOST: ${PRODUCTION_HOST}

    # NOTE: Using external PostgreSQL and MinIO services
    # depends_on:
    #   - postgres
    #   - minio

    restart: unless-stopped
    # The command to run the application is defined in the Dockerfile's CMD instruction
    # which uses wait-for-db.sh for optimized startup
    networks:
      - docker_internal
      - default

  # =================================================================
