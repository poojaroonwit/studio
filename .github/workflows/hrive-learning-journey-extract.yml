name: Hrive Learning journey extraction

on:
  push:
    branches:
      - refactor/hrive-learning-shell-decomposition

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[hrive-journey-extract]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/hrive-learning-shell-decomposition
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/codemods/extract-learning-journey-header.mjs
      - run: node scripts/learning-component-decomposition-regression-checks.cjs
      - run: npm run type-check
      - run: npx eslint src/app/learning/LearningPageClient.tsx src/app/learning/LearningJourneyHeader.tsx --max-warnings=0
      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/learning/LearningPageClient.tsx src/app/learning/LearningJourneyHeader.tsx
          git commit -m "refactor: extract Learning journey header [hrive-journey-extract]"
          git pull --rebase origin refactor/hrive-learning-shell-decomposition
          git push origin HEAD:refactor/hrive-learning-shell-decomposition
