name: Apply safe production dependency fixes

on:
  push:
    branches: [fix/full-stabilization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - name: Apply only non-breaking audit fixes
        run: npm audit fix --omit=dev --package-lock-only --ignore-scripts --no-audit --no-fund || true
      - name: Show remaining production audit
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit lockfile-only fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-production-deps.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No safe lockfile changes available."
            git commit --allow-empty -m "chore: remove temporary dependency fix workflow"
          else
            git commit -m "fix: apply safe production dependency updates"
          fi
          git push origin HEAD:fix/full-stabilization
