name: Stabilization diagnostic

on:
  push:
    branches: [fix/full-stabilization]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/full-stabilization
      - name: Source risk scan
        shell: bash
        run: |
          echo '=== DESTRUCTIVE / MIGRATION COMMANDS ==='
          grep -RInE 'accept-data-loss|prisma db push|migrate resolve|SKIP_TYPESCRIPT_CHECK' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=migrations-legacy . || true
          echo '=== SUPPRESSIONS ==='
          grep -RInE '@ts-ignore|eslint-disable' src scripts --exclude='*.snap' || true
          echo '=== TODO/FIXME/HACK ==='
          grep -RInE '\b(TODO|FIXME|HACK)\b' src scripts prisma --exclude-dir=migrations-legacy || true
          echo '=== POWERSHELL-ONLY ==='
          grep -RInE 'powershell|Set-Item Env:|Remove-Item Env:' package.json scripts .github playwright.config.ts || true
          echo '=== RAW DATABASE OBJECTS ACTIVE ==='
          grep -RInE 'CREATE (OR REPLACE )?(FUNCTION|TRIGGER|VIEW)|ADD CONSTRAINT|USING GIN|WHERE .* IS (NOT )?NULL' prisma/migrations scripts --exclude-dir=migrations-legacy || true
          echo '=== LARGEST SOURCE FILES ==='
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 wc -l | sort -nr | head -80
          echo '=== BASELINE ==='
          cat scripts/frontend-line-budget-baseline.json
